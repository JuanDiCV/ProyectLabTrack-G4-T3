# ==========================================================
# LabTrack - Configuración de análisis estático SonarQube
# Ejecutar desde la raíz:  npx sonar-scanner  (o sonar-scanner)
# Requiere generar antes la cobertura: npm run test:coverage
# ==========================================================
sonar.projectKey=labtrack
sonar.projectName=LabTrack - Gestión de Préstamos de Laboratorios
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Código fuente analizado
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,qa/selenium
sonar.test.inclusions=backend/tests/**/*.ts,qa/selenium/**/*.mjs

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts

# Reportes de cobertura (formato LCOV generado por Vitest / v8)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json

# La capa HTTP, la persistencia y la UI se validan con E2E (Selenium) y carga (JMeter);
# la cobertura unitaria se mide sobre la lógica de negocio (services, schemas, shared).
sonar.coverage.exclusions=backend/src/server.ts,backend/src/app.ts,backend/src/**/*.routes.ts,backend/src/**/*.controller.ts,backend/src/**/*.repository.ts,backend/src/shared/prisma.ts,backend/src/shared/env.ts,backend/src/middlewares/**,frontend/src/**

# Detección de duplicados: ignorar pruebas
sonar.cpd.exclusions=backend/tests/**,qa/**
